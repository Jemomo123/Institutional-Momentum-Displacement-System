<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quant Core V2 Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030305; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; }
        .border-killer { box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); border: 1px solid #ef4444; }
        .border-high { box-shadow: 0 0 15px rgba(245, 158, 11, 0.25); border: 1px solid #f59e0b; }
        .border-medium { box-shadow: 0 0 10px rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; }
    </style>
</head>
<body class="text-gray-200 antialiased selection:bg-yellow-500 selection:text-black">

    <header class="sticky top-0 z-50 bg-[#06060a] border-b border-gray-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></div>
            <span class="text-xs tracking-widest text-gray-400 font-bold uppercase">DISPLACEMENT_LIFECYCLE_V2</span>
        </div>
        <div class="text-right">
            <span class="text-xs text-red-400 font-bold font-mono">SYS_LIVE</span>
        </div>
    </header>

    <main class="p-3 space-y-3 pb-24">
        <div id="signals-container" class="space-y-3">
            <div class="text-center text-xs text-gray-600 font-mono py-16">Awaiting institutional structural displacement events...</div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-[#040407] border-t border-gray-800 px-4 py-2 flex justify-around text-center text-xs font-mono z-50">
        <button class="text-red-500 font-bold py-1 w-full">DISPLACEMENT TRACKS</button>
        <button class="text-gray-500 py-1 w-full border-l border-gray-800">SYSTEM MONITORS</button>
    </footer>

    <script>
        const evtSource = new EventSource("/stream/signals");
        const container = document.getElementById("signals-container");

        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.length === 0) return;
            
            container.innerHTML = "";
            data.forEach(sig => {
                const tierClass = sig.tier === 'KILLER' ? 'border-killer' : (sig.tier === 'HIGH' ? 'border-high' : 'border-medium');
                const badgeColor = sig.tier === 'KILLER' ? 'bg-red-600 text-black' : (sig.tier === 'HIGH' ? 'bg-amber-500 text-black' : 'bg-blue-600 text-white');
                const dirColor = sig.direction === 'LONG' ? 'text-emerald-400' : 'text-red-500';

                container.innerHTML += `
                    <div class="bg-[#07070d] rounded-lg p-3 ${tierClass} space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h2 class="text-lg font-black tracking-tight text-white font-mono">${sig.symbol}</h2>
                                    <span class="text-[10px] bg-gray-900 text-gray-300 font-bold px-1.5 rounded">${sig.timeframe}</span>
                                </div>
                                <p class="text-[10px] text-gray-400">STATE REVISIT: <span class="text-yellow-400 font-bold font-mono">MITIGATION ACTIVE</span></p>
                            </div>
                            <div class="text-right">
                                <span class="inline-block text-[10px] font-extrabold ${badgeColor} px-2 py-0.5 rounded font-mono">${sig.tier}</span>
                                <span class="block text-xs font-bold mt-1 ${dirColor}">${sig.direction}</span>
                            </div>
                        </div>
                        <hr class="border-gray-800">
                        <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs font-mono">
                            <div class="flex justify-between"><span class="text-gray-500">Quality Score:</span><span class="text-white font-bold">${sig.quality_score}%</span></div>
                            <div class="flex justify-between"><span class="text-gray-500">Retest Loop:</span><span class="text-white font-bold">#${sig.retest_index}</span></div>
                        </div>
                        <div class="bg-[#020204] p-2 rounded border border-gray-800 text-[11px] font-mono">
                            <div class="flex justify-between"><span class="text-gray-500">True OB Zone:</span><span class="text-gray-200 font-bold">$${sig.zone.bottom.toFixed(2)} - $${sig.zone.top.toFixed(2)}</span></div>
                        </div>
                        <div class="text-[11px] text-gray-400 font-mono">${sig.msg}</div>
                    </div>
                `;
            });
        };
    </script>
</body>
</html>
